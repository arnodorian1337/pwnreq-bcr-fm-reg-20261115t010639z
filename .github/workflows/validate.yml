name: Validate reviewed documentation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate-reviewed-docs:
    name: validate-reviewed-docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: python3 tools/validate_docs.py origin/main reviewed-digest.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: reviewed-docs-${{ github.event.pull_request.head.sha }}
          path: reviewed-digest.json
          if-no-files-found: error
          retention-days: 1
  merge-window:
    name: merge-window
    needs: validate-reviewed-docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Preserve the post-review pre-first-deploy replacement window
        run: sleep 480
